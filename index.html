<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Page</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7ff, #dfe9ff);
        color: #1f2937;
      }

      .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 32px 40px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 420px;
        width: 90%;
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      p {
        margin: 16px 0 24px;
        line-height: 1.6;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 1rem;
        cursor: pointer;
        background: #4f46e5;
        color: white;
        transition: transform 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello, world!</h1>
      <p>This is a simple webpage created in HTML, CSS, and JavaScript.</p>
      <button id="clickMe">Click me</button>
    </div>

    <script>
      const button = document.getElementById('clickMe');

      button.addEventListener('click', () => {
        button.textContent = 'Clicked!';
      });
    </script>
  </body>
</html>
